spring.application.name=tx-patterns-demo

# In-memory H2. LOCK_TIMEOUT gives pessimistic-lock demos room to wait.
spring.datasource.url=jdbc:h2:mem:txdemo;LOCK_TIMEOUT=10000
spring.datasource.hikari.maximum-pool-size=10
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
# Never keep a DB connection open for the whole HTTP request.
spring.jpa.open-in-view=false

# The most useful setting for learning: logs every begin / join / suspend / commit / rollback.
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%-18.18thread] %-28.28logger{0} : %msg%n

# Outbox relay polling interval (ms)
demo.outbox.poll-ms=3000
demo.outbox.scheduler.enabled=true
